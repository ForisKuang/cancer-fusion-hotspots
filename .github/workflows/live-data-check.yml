name: Live data check

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-data-check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CFH_RUN_NETWORK_TESTS: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Run live cBioPortal and Genome Nexus tests
        run: pytest -m network
